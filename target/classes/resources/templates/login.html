<form th:action="@{/login}" method="post">

    <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <input type="email"
               name="username"
               class="form-control"
               required
               autofocus>
    </div>

    <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password"
               name="password"
               class="form-control"
               required>
    </div>

    <button type="submit"
            class="btn btn-primary w-100">
        Entrar
    </button>

</form>
