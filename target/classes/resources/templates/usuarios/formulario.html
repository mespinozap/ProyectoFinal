<div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text"
           th:field="*{nombre}"
           class="form-control">
</div>

<div class="mb-3">
    <label class="form-label">Cédula</label>
    <input type="text"
           th:field="*{cedula}"
           class="form-control">
</div>

<div class="mb-3">
    <label class="form-label">Teléfono</label>
    <input type="text"
           th:field="*{telefono}"
           class="form-control">
</div>

<div class="mb-3">
    <label class="form-label">Correo</label>
    <input type="email"
           th:field="*{email}"
           class="form-control">
</div>

<div class="mb-3">
    <label class="form-label">Contraseña</label>
    <input type="password"
           th:field="*{password}"
           class="form-control">
</div>

<div class="mb-3">
    <label class="form-label">Rol</label>

    <select th:field="*{rol}" class="form-select">

        <option value="ADMIN">ADMIN</option>
        <option value="CLIENTE">CLIENTE</option>

    </select>
</div>
